# Configuración del analizador estático.
#
# Fase 0 del "Plan Estructura Limpia.md": red de seguridad.
#
# CRITERIO: la Fase 0 debe dejar un semáforo verde/rojo CONFIABLE. Una regla
# que arranca en rojo con cientos de issues no es una red de seguridad, es
# ruido que oculta las regresiones reales. Por eso aquí solo entran reglas
# que están en 0 hoy, o que son la lista de trabajo explícita de una fase.
#
# DIFERIDO A LA FASE 9 (medido el 2026-08-09, no re-discutir sin volver a medir):
#   strict-casts: true      -> 119 ERRORES. El `List<dynamic> fixturesRaw` de
#                              catalog_models se propaga por toda la app. Entra
#                              cuando la Fase 4 tipe los modelos.
#   strict-raw-types        -> mismo origen.
#   avoid_dynamic_calls     -> mismo origen.
#   prefer_final_locals     -> 155 issues cosméticos. Arreglarlos en la Fase 1
#                              contaminaría el diff de "solo mover archivos".
#   directives_ordering     -> 49 issues; se reordenan solos en la Fase 1.A.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Medido en la Fase 9: 1 issue. Practicamente gratis.
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "build/**"
  errors:
    todo: ignore

linter:
  rules:
    # Lista de trabajo explícita de la Fase 1.A: 136 issues hoy -> 0 al cerrar.
    # Con imports absolutos, mover un archivo es un reemplazo textual
    # determinista en vez de recalcular cada `../`.
    - always_use_package_imports

    # Clase de bug real (fire-and-forget async): 12 issues hoy.
    - unawaited_futures

    # 1 issue hoy (matches_dao.dart:292).
    - avoid_print

    # En 0 hoy: entran como candado para que no aparezcan.
    - depend_on_referenced_packages
    - use_super_parameters
